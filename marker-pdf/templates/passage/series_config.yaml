# Passage Series — shared PDF conversion config
# These font/style rules are shared across all books in the Passage series.
# Book-specific config (hierarchy, front matter, etc.) lives in <book>/book_config.yaml.
# All size thresholds are expressed as RATIOS relative to body text size.

body_font: auto

headings:
  - weight: regular
    min_ratio: 1.85
    max_ratio: 2.15
    level: 1
  - weight: bold
    min_ratio: 1.85
    max_ratio: 2.15
    level: 3
  - weight: italic
    min_ratio: 1.35
    max_ratio: 1.55
    level: 2
  - weight: bold
    min_ratio: 1.70
    max_ratio: 1.85
    level: 4
  - weight: bold
    min_ratio: 1.35
    max_ratio: 1.55
    level: 4
  - weight: bold
    min_ratio: 1.15
    max_ratio: 1.30
    level: 5

skip_large_ratio: 2.4

running_header_signature:
  - weight: bold
    min_ratio: 1.35
    max_ratio: 1.55
  - weight: bold
    min_ratio: 0.88
    max_ratio: 1.00

quote_max_ratio: 0.88
citation_max_chars: 80

verse_label_signature:
  - weight: bold
    min_ratio: 0.95
    max_ratio: 1.05
  - weight: bold
    min_ratio: 0.62
    max_ratio: 0.75

callout_signature:
  - weight: regular
    min_ratio: 1.55
    max_ratio: 1.65

citation_patterns:
  - '^[A-Z][a-zA-Z]+\s+\d+:\d+[\d\-\u2013\u2014,;:\s]*$'
  - '^[A-Z][a-zA-Z]+\.\s+\d+:\d+[\d\-\u2013\u2014,;:\s]*$'

discussion_question_labels:
  - "##### Searching the Text"
  - "##### Seeking the Truth"
  - "##### Evaluating Our Lives"

discussion_heading_pattern: "Discussion Questions"
