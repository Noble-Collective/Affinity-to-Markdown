# Classics Series — shared PDF conversion config
# Books in this series use EB Garamond typography from Affinity Publisher.
# All size thresholds are expressed as RATIOS relative to body text size.

body_font: auto

headings:
  # H1: Chapter headings — 20pt bold (1.82x)
  - weight: bold
    min_ratio: 1.75
    max_ratio: 1.95
    level: 1
  # H1: Book title — 14pt regular (1.27x)
  - weight: regular
    min_ratio: 1.20
    max_ratio: 1.35
    level: 1
  # H2: Chapter subtitle themes — 13pt regular/medium (1.18x)
  - weight: regular
    min_ratio: 1.12
    max_ratio: 1.22
    level: 2

skip_large_ratio: 2.5

# No running headers in this series
running_header_signature: []

# No distinct quote font — blockquotes come from Marker's indent detection
quote_max_ratio: 0.0
citation_max_chars: 120

# No verse labels in this series
verse_label_signature: []

# No callout/pull-quote font in this series
callout_signature: []

# Citation patterns — scripture references
citation_patterns:
  - '^[1-3]?\s*[A-Z][a-zA-Z]+\s+\d+:\d+[\d\-\u2013\u2014,;:\s]*$'

discussion_question_labels: []
discussion_heading_pattern: ""
